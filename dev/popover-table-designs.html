<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>팝오버 하단 디자인 시안</title>
<style>
  :root {
    --popover-width: 380px;
    --ink: #eff1f5;
    --secondary: #c2c8d1;
    --muted: #a2aab6;
    --line: rgb(233 240 255 / .12);
    --surface: rgb(233 240 255 / .055);
    --raised: rgb(233 240 255 / .085);
    --focus: #90c5ff;
    --unit: 4px;
    --space-1: calc(var(--unit) / 2);
    --space-2: var(--unit);
    --space-3: calc(1.5 * var(--unit));
    --space-4: calc(2 * var(--unit));
    --space-5: calc(3 * var(--unit));
    --space-6: calc(4 * var(--unit));
    --text-sm: 10px;
    --text-label: 11px;
    --text-body: 12px;
    --text-name: 13px;
    --text-time: 15px;
    --radius-sm: 6px;
    --radius: 9px;
    --radius-pane: 12px;
    --radius-popover: 18px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-width: 280px;
    min-height: 100svh;
    color: var(--ink);
    font: var(--text-body) / 1.3 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: radial-gradient(ellipse at 46% 4%, #354357, #191e28 57%, #151922);
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .stage {
    display: grid;
    justify-items: center;
    align-content: safe center;
    gap: var(--space-5);
    min-height: 100svh;
    padding: var(--space-6);
  }
  .popover {
    width: min(100%, var(--popover-width));
    padding: var(--space-6);
    border: 1px solid rgb(224 234 255 / .25);
    border-radius: var(--radius-popover);
    background: linear-gradient(172deg, rgb(69 76 89 / .88), rgb(55 60 71 / .92) 65%);
    backdrop-filter: blur(26px) saturate(135%);
    box-shadow: 0 18px 52px #080a1190, inset 0 1px 0 #ffffff11;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--space-4);
    height: 26px;
    margin-bottom: var(--space-5);
  }
  .icon-button {
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    font-size: 19px;
    line-height: 1;
  }
  .icon-button:hover { background: var(--raised); }
  #redraw { color: var(--muted); }
  #redraw.spinning { animation: spin 260ms ease; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #redraw.spinning { animation: none; } }
  .menu { position: relative; z-index: 2; }
  .menu summary { list-style: none; cursor: pointer; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu-items {
    position: absolute;
    top: calc(100% + var(--space-2));
    right: 0;
    display: grid;
    width: 164px;
    max-height: min(350px, 66svh);
    overflow: auto;
    padding: var(--space-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-pane);
    background: #303744;
    box-shadow: 0 12px 30px #080a1177;
  }
  .menu-items button {
    display: flex;
    justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    text-align: left;
  }
  .menu-items button:hover, .menu-items button[aria-pressed="true"] { background: var(--raised); }
  .menu-items button[aria-pressed="true"]::after { content: "✓"; color: var(--focus); }

  .plot-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
  .plot-row canvas { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; }
  .legend {
    display: flex;
    gap: var(--space-5);
    margin: var(--space-4) 0 var(--space-5);
    color: var(--muted);
    font-size: var(--text-label);
    font-weight: 600;
  }
  .legend span { display: inline-flex; align-items: center; gap: var(--space-3); }
  .dot {
    display: inline-block;
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    border: 1.5px solid var(--provider, currentColor);
    border-radius: 50%;
    vertical-align: middle;
  }
  .dot.weekly { background: var(--provider, currentColor); }

  .brand { display: inline-flex; align-items: center; gap: var(--space-3); min-width: 0; font-weight: 650; }
  .brand-logo { width: 14px; height: 14px; object-fit: contain; flex: 0 0 auto; }
  .brand-logo.codex { filter: invert(1); }
  .service-name { overflow-wrap: anywhere; }
  .moment {
    display: inline-flex;
    flex-direction: column;
    align-items: inherit;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .day { color: var(--muted); font-size: var(--text-label); }
  .clock { color: var(--secondary); font-weight: 520; }
  .slot-label { color: var(--muted); font-size: var(--text-label); font-weight: 650; }
  .moment-with-dot { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
  .moment-with-dot .moment { align-items: flex-end; }
  .reset-table {
    display: grid;
    grid-template-columns: minmax(82px, 1fr) minmax(0, 1fr) minmax(0, 1fr);
    align-items: center;
    column-gap: var(--space-3);
  }
  .table-row { display: contents; }
  .reset-table .table-header { justify-self: end; padding-bottom: var(--space-3); }
  .reset-table .table-name, .reset-table .table-cell {
    display: flex;
    align-items: center;
    min-height: 36px;
    min-width: 0;
  }
  .reset-table .table-name { font-size: var(--text-name); }
  .reset-table .table-cell { justify-content: flex-end; }
  .reset-table .table-cell > .moment-with-dot { justify-content: flex-end; }
  .reference .table-cell, .reference .table-name { min-height: 43px; }
  .reference .table-cell { padding-right: var(--space-1); }

  .compact-table .table-cell, .compact-table .table-name {
    border-top: 1px solid var(--line);
    min-height: 34px;
  }
  .compact-table .table-cell .moment {
    flex-flow: row wrap;
    justify-content: flex-end;
    align-items: baseline;
    gap: 0 var(--space-2);
  }
  .compact-table .table-cell .dot { width: 6px; height: 6px; }
  .compact-table .clock { color: var(--ink); font-size: var(--text-label); }
  .compact-table .day { font-size: var(--text-sm); }

  .clock-first .table-cell, .clock-first .table-name { min-height: 43px; }
  .clock-first .moment { flex-direction: column-reverse; }
  .clock-first .clock { color: var(--ink); font-size: var(--text-time); font-weight: 630; }
  .clock-first .day { font-size: var(--text-sm); }

  .chip-table { row-gap: var(--space-3); }
  .chip-table .table-header { padding-bottom: 0; }
  .chip-table .table-cell { justify-content: stretch; }
  .chip-table .table-cell > .moment-with-dot {
    justify-content: space-between;
    width: 100%;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .chip-table .clock { color: var(--ink); }

  .provider-cards { display: grid; gap: var(--space-3); }
  .provider-card {
    display: grid;
    gap: var(--space-3);
    padding: var(--space-4);
    border: 1px solid var(--line);
    border-radius: var(--radius-pane);
    background: var(--surface);
  }
  .provider-card > .brand { font-size: var(--text-name); }
  .provider-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
  .provider-pair .period {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-2) var(--space-3);
    padding-top: var(--space-3);
    border-top: 1px solid var(--line);
  }
  .provider-pair .period .moment { align-items: flex-end; }

  .columns { display: grid; gap: var(--space-3); }
  .columns.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
  .columns.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .small-card {
    display: grid;
    gap: var(--space-3);
    align-content: start;
    padding: var(--space-4);
    border-top: 2px solid var(--provider, var(--line));
    border-radius: var(--radius);
    background: var(--surface);
    min-width: 0;
  }
  .small-card .brand { align-items: center; font-size: var(--text-label); }
  .small-card .period { display: grid; gap: var(--space-1); padding-top: var(--space-3); border-top: 1px solid var(--line); }
  .small-card .period .slot-label { font-size: var(--text-sm); }
  .small-card .moment { align-items: flex-start; }
  .small-card .clock { color: var(--ink); }
  .period-card .period-entry {
    display: flex;
    justify-content: space-between;
    gap: var(--space-2);
    align-items: center;
    min-height: 32px;
    padding-top: var(--space-3);
    border-top: 1px solid var(--line);
  }
  .period-card .moment { align-items: flex-end; }
  .period-card .day, .period-card .clock { font-size: var(--text-sm); }
  .period-card .brand { gap: var(--space-2); }
  .period-card .brand-logo { width: 11px; height: 11px; }

  .period-bands { display: grid; gap: var(--space-3); }
  .period-band {
    padding: var(--space-4);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .period-band .band-heading { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }
  .period-band .band-services { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .band-service { display: grid; gap: var(--space-2); padding-inline: var(--space-3); }
  .band-service + .band-service { border-left: 1px solid var(--line); }
  .band-service .brand { font-size: var(--text-label); }

  .by-date { display: grid; gap: var(--space-5); }
  .date-title {
    margin: 0 0 var(--space-3);
    color: var(--muted);
    font-size: var(--text-label);
    font-weight: 650;
  }
  .timeline-list { margin: 0; padding: 0; list-style: none; }
  .timeline-entry {
    display: grid;
    grid-template-columns: minmax(65px, .9fr) 9px minmax(76px, 1.1fr) minmax(60px, auto);
    align-items: center;
    gap: var(--space-4);
    min-height: 29px;
  }
  .timeline-entry + .timeline-entry { border-top: 1px solid var(--line); }
  .timeline-entry .moment { color: var(--ink); }
  .timeline-entry .slot-label { justify-self: end; }
  .timeline-entry .brand { font-size: var(--text-label); }

  .event-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
  .event-tile {
    display: grid;
    gap: var(--space-2);
    padding: var(--space-4);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .event-tile .event-meta { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
  .event-tile .moment { color: var(--ink); font-size: var(--text-time); }
  .event-tile .brand { font-size: var(--text-label); }

  .paired-list { display: grid; gap: var(--space-4); }
  .paired-row {
    display: grid;
    grid-template-columns: minmax(82px, .85fr) minmax(0, 2fr);
    gap: var(--space-4);
    align-items: center;
    padding-bottom: var(--space-3);
  }
  .paired-row + .paired-row { border-top: 1px solid var(--line); padding-top: var(--space-4); }
  .paired-track { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
  .paired-event { display: grid; gap: var(--space-2); position: relative; }
  .paired-event:first-child::before {
    content: "";
    position: absolute;
    top: 4px;
    left: 11px;
    right: calc(-1 * var(--space-3) + 3px);
    border-top: 1px solid var(--line);
  }
  .paired-event .slot-label { font-size: var(--text-sm); }
  .paired-event .clock { color: var(--ink); }

  .navigator {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    color: var(--secondary);
  }
  .navigator button {
    min-width: 30px;
    height: 29px;
    padding: 0 var(--space-3);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: var(--text-time);
  }
  .navigator button:hover { background: var(--raised); }
  .navigator #variant-name {
    min-width: 126px;
    padding: 0 var(--space-3);
    border-color: transparent;
    background: transparent;
    color: var(--secondary);
    font-size: var(--text-label);
    font-weight: 600;
  }
  @media (max-width: 375px) {
    .stage { padding: var(--space-4); }
    .popover { padding: var(--space-5); }
    .plot-row, .columns.three { gap: var(--space-4); }
    .small-card { padding: var(--space-3); }
    .timeline-entry { gap: var(--space-3); }
    .brand { gap: var(--space-2); }
    .brand-logo { width: 12px; height: 12px; }
  }
  @media (max-width: 320px) {
    .reset-table { column-gap: var(--space-2); }
    .chip-table .table-cell > .moment-with-dot { padding-inline: var(--space-2); }
    .chip-table .clock { font-size: var(--text-label); }
    .period-card .period-entry { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<main class="stage">
  <article class="popover" aria-label="AI 사용 현황 팝오버 미리보기">
    <header class="toolbar">
      <button id="redraw" class="icon-button" type="button" aria-label="샘플 새로고침" title="샘플 새로고침">⟳</button>
      <details class="menu" id="variant-menu">
        <summary class="icon-button" aria-label="하단 디자인 시안 선택" title="하단 디자인 시안 선택">···</summary>
        <div class="menu-items" id="variant-options"></div>
      </details>
    </header>
    <div class="plot-row" id="plots"></div>
    <div class="legend">
      <span><i class="dot weekly" aria-hidden="true"></i>주간</span>
      <span><i class="dot short" aria-hidden="true"></i>5시간·일간</span>
    </div>
    <section id="reset-panel" aria-label="리셋 시간"></section>
  </article>
  <nav class="navigator" aria-label="하단 디자인 시안 탐색">
    <button id="previous" type="button" aria-label="이전 시안" title="이전 시안 (←)">‹</button>
    <button id="variant-name" type="button" aria-expanded="false" aria-controls="variant-options"></button>
    <button id="next" type="button" aria-label="다음 시안" title="다음 시안 (→)">›</button>
  </nav>
</main>

  function getReset(provider, slot) {
    const reset = provider[slot.id];
    const date = new Date(reset.at);
    const dayKey = reset.at.slice(0, 10);
    return {
      provider, slot, at: reset.at, dayKey,

  function dot(slot) {
    return `<i class="dot ${slot.id}" aria-hidden="true"></i>`;

  function moment(reset, showDay = true) {
    return `<time class="moment" datetime="${reset.at}">
      ${showDay ? `<span class="day">${reset.day}</span>` : ""}
      <span class="clock">${reset.clock}</span>
    </time>`;
  }

  function markedMoment(reset) {

    </span>`;

      <div class="table-row" role="row">
        <span role="columnheader" aria-label="프로바이더"></span>
        ${slots.map(slot => `<span class="table-header slot-label" role="columnheader">${slot.name}</span>`).join("")}
      </div>
      ${providers.map(provider => `<div class="table-row" role="row">
        <span class="table-name" role="rowheader">${brand(provider)}</span>
        ${slots.map(slot => `<span class="table-cell" role="cell">${markedMoment(getReset(provider, slot))}</span>`).join("")}
      </div>`).join("")}
    </div>`;
  }

  function serviceCards() {
    return `<div class="provider-cards">${providers.map(provider => `<section class="provider-card" aria-label="${provider.name}">
      ${brand(provider)}
      <div class="provider-pair" style="--provider:${provider.color}">
        ${slots.map(slot => `<div class="period">
          <span class="slot-label">${dot(slot)} ${slot.name}</span>
          ${moment(getReset(provider, slot))}
        </div>`).join("")}
      </div>
    </section>`).join("")}</div>`;
  }

  function threeColumns() {
    return `<div class="columns three">${providers.map(provider => `<section class="small-card" style="--provider:${provider.color}" aria-label="${provider.name}">
      ${brand(provider)}
      ${slots.map(slot => `<div class="period">
        <span class="slot-label">${dot(slot)} ${slot.name}</span>
        ${moment(getReset(provider, slot))}
      </div>`).join("")}
    </section>`).join("")}</div>`;
  }

  function twoPeriodLists() {
    return `<div class="columns two">${slots.map(slot => `<section class="small-card period-card" aria-label="${slot.name}">
      <div class="slot-label">${dot(slot)} ${slot.name}</div>
      ${providers.map(provider => `<div class="period-entry">
        ${brand(provider)}${moment(getReset(provider, slot))}
      </div>`).join("")}
    </section>`).join("")}</div>`;
  }

  function periodBands() {
    return `<div class="period-bands">${slots.map(slot => `<section class="period-band" aria-label="${slot.name}">
      <div class="band-heading slot-label">${dot(slot)} ${slot.name}</div>
      <div class="band-services">${providers.map(provider => `<div class="band-service">
        ${brand(provider)}${moment(getReset(provider, slot))}
      </div>`).join("")}</div>
    </section>`).join("")}</div>`;
  }

  function groupedResets() {
    const events = providers.flatMap(provider => slots.map(slot => getReset(provider, slot)));
    events.sort((left, right) => left.at.localeCompare(right.at));
    const days = new Map();
    for (const event of events) {
      if (!days.has(event.dayKey)) days.set(event.dayKey, []);
      days.get(event.dayKey).push(event);
    }
    return [...days.values()];
  }

  function timeline() {
    return `<div class="by-date">${groupedResets().map(resets => `<section>
      <h2 class="date-title">${resets[0].day}</h2>
      <ol class="timeline-list">${resets.map(reset => `<li class="timeline-entry" style="--provider:${reset.provider.color}">
        ${moment(reset, false)}${dot(reset.slot)}${brand(reset.provider)}
        <span class="slot-label">${reset.slot.name}</span>
      </li>`).join("")}</ol>
    </section>`).join("")}</div>`;
  }

  function dateTiles() {
    return `<div class="by-date">${groupedResets().map(resets => `<section>
      <h2 class="date-title">${resets[0].day}</h2>
      <div class="event-grid">${resets.map(reset => `<div class="event-tile" style="--provider:${reset.provider.color}">
        <div class="event-meta">${brand(reset.provider)}${dot(reset.slot)}</div>
        ${moment(reset, false)}
        <span class="slot-label">${reset.slot.name}</span>
      </div>`).join("")}</div>
    </section>`).join("")}</div>`;
  }

  function pairedTimeline() {
    return `<div class="paired-list">${providers.map(provider => `<section class="paired-row" aria-label="${provider.name}">
      ${brand(provider)}
      <div class="paired-track" style="--provider:${provider.color}">
        ${slots.map(slot => `<div class="paired-event">
          ${dot(slot)}
          ${moment(getReset(provider, slot))}
          <span class="slot-label">${slot.name}</span>
        </div>`).join("")}
      </div>
    </section>`).join("")}</div>`;
  }

  const designs = [
    { id: "reference", name: "현재 디자인", render: () => resetTable("reference") },
    { id: "compact", name: "간결한 표", render: () => resetTable("compact-table") },
    { id: "clock", name: "시간 강조", render: () => resetTable("clock-first") },
    { id: "chips", name: "칩형 표", render: () => resetTable("chip-table") },
    { id: "service-cards", name: "서비스 카드", render: serviceCards },
    { id: "three-columns", name: "서비스 3열", render: threeColumns },
    { id: "period-lists", name: "기간별 두 목록", render: twoPeriodLists },
    { id: "period-bands", name: "기간별 가로 밴드", render: periodBands },
    { id: "timeline", name: "리셋 순 타임라인", render: timeline },
    { id: "date-tiles", name: "날짜별 타일", render: dateTiles },
    { id: "paired", name: "두 시점 연결", render: pairedTimeline }
  ];

  function drawPlots() {
    const plots = document.getElementById("plots");
    const width = 108;
    const height = 72;
    plots.replaceChildren();

    for (const provider of providers) {
      const canvas = document.createElement("canvas");
      canvas.width = 2 * width;
      canvas.height = 2 * height;
      canvas.setAttribute("aria-label", `${provider.name} 사용량 차트`);
      canvas.setAttribute("role", "img");
      plots.append(canvas);

      const context = canvas.getContext("2d");
      if (!context) continue;
      context.scale(2, 2);
      context.strokeStyle = "rgba(239, 241, 245, .08)";
      context.lineWidth = 1;
      context.strokeRect(.5, .5, width - 1, height - 1);
      context.beginPath();
      for (let division = 1; division < 4; division++) {
        const x = width * division / 4;
        const y = height * division / 4;
        context.moveTo(x, 0);
        context.lineTo(x, height);
        context.moveTo(0, y);
        context.lineTo(width, y);
      }
      context.stroke();

      context.beginPath();
      context.moveTo(.5, height - .5);
      context.lineTo(width - .5, .5);
      context.strokeStyle = "rgba(239, 241, 245, .43)";
      context.lineWidth = 1.5;
      context.lineCap = "round";
      context.setLineDash([.1, 3.9]);
      context.stroke();
      context.setLineDash([]);

      for (const slot of slots) {
        const point = provider[slot.id];
        const x = point.elapsed * width;
        const y = (1 - point.used) * height;
        context.beginPath();
        context.arc(x, y, slot.id === "short" ? 3.25 : 4, 0, 2 * Math.PI);
        context.strokeStyle = provider.color;
        context.fillStyle = provider.color;
        if (slot.id === "short") context.stroke();
        else context.fill();
      }
    }
  }

  const panel = document.getElementById("reset-panel");
  const menu = document.getElementById("variant-menu");
  const options = document.getElementById("variant-options");
  const name = document.getElementById("variant-name");
  let selected = 0;

  for (const [index, design] of designs.entries()) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = design.name;
    button.addEventListener("click", () => {
      selectDesign(index);
      menu.open = false;
      name.focus();
    });
    options.append(button);
  }

  function selectDesign(index, save = true) {
    selected = (index + designs.length) % designs.length;
    const design = designs[selected];
    panel.innerHTML = design.render();
    panel.dataset.design = design.id;
    name.textContent = selected ? `${selected} / ${designs.length - 1}  ${design.name}` : design.name;
    name.setAttribute("aria-label", `시안 선택, 현재 ${design.name}`);
    for (const [optionIndex, button] of [...options.children].entries()) {
      button.setAttribute("aria-pressed", String(optionIndex === selected));
    }
    if (save && location.hash !== `#${design.id}`) location.hash = design.id;
  }

  function selectFromAddress() {
    const index = designs.findIndex(design => `#${design.id}` === location.hash);
    selectDesign(index === -1 ? 1 : index, false);
  }

  document.getElementById("previous").addEventListener("click", () => selectDesign(selected - 1));
  document.getElementById("next").addEventListener("click", () => selectDesign(selected + 1));
  name.addEventListener("click", () => {
    menu.open = !menu.open;
    if (menu.open) options.children[selected].focus();
  });
  menu.addEventListener("toggle", () => name.setAttribute("aria-expanded", String(menu.open)));
  document.addEventListener("click", event => {
    if (!menu.contains(event.target) && !name.contains(event.target)) menu.open = false;
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && menu.open) {
      menu.open = false;
      name.focus();
    }
    if (event.altKey || event.metaKey || event.ctrlKey || menu.open) return;
    if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
      event.preventDefault();
      selectDesign(selected + (event.key === "ArrowRight" ? 1 : -1));
    }
  });

  const redraw = document.getElementById("redraw");
  redraw.addEventListener("click", () => {
    drawPlots();
    selectDesign(selected, false);
    redraw.classList.remove("spinning");
    void redraw.offsetWidth;
    redraw.classList.add("spinning");
  });
  redraw.addEventListener("animationend", () => redraw.classList.remove("spinning"));
  window.addEventListener("hashchange", selectFromAddress);

  drawPlots();
  selectFromAddress();
</script>
</body>
</html>
